[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
# OAuth desktop : Google interdit l'auth en webview, on ouvre le navigateur
# système (opener) et on récupère le code via un deep link (deep-link).
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# Notes en .md dans un vault Obsidian : choix du dossier (dialog) puis
# lecture/écriture des fichiers (fs). La File System Access API du navigateur
# n'est pas disponible dans la WebView, d'où le passage par les plugins natifs.
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Suivi d'activité : le titre de la fenêtre active passe par l'API
# d'accessibilité (cf. src/tracker.rs). Les symboles AX sont déclarés sur place ;
# ces deux caisses ne servent qu'à manipuler les chaînes Core Foundation qu'elle
# rend, et arrivaient déjà en dépendance indirecte de Tauri.
core-foundation = "0.10"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
# Suivi d'activité (cf. src/tracker.rs) : fenêtre de premier plan, processus
# propriétaire et temps d'inactivité clavier/souris. `windows-sys` et non
# `windows` : ce sont les liaisons BRUTES, dont la signature ne bouge pas d'une
# version à l'autre, pour trois appels qui n'ont pas besoin d'ergonomie.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
# Sur Windows/Linux, le deep link arrive en argument d'un 2e process : on le
# relaie à l'instance déjà lancée via single-instance.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
