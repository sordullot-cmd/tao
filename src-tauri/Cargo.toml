[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
# OAuth desktop : Google interdit l'auth en webview, on ouvre le navigateur
# système (opener) et on récupère le code via un deep link (deep-link).
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# Notes en .md dans un vault Obsidian : choix du dossier (dialog) puis
# lecture/écriture des fichiers (fs). La File System Access API du navigateur
# n'est pas disponible dans la WebView, d'où le passage par les plugins natifs.
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
# Sur Windows/Linux, le deep link arrive en argument d'un 2e process : on le
# relaie à l'instance déjà lancée via single-instance.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
